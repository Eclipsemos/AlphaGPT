name: Binance factor research CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Compile sources
        run: python -m compileall -q data_pipeline model_core dashboard tests
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v
      - name: Run offline end-to-end acceptance
        run: python -m model_core.binance_acceptance --output-dir /tmp/alphagpt-acceptance
